<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simple File Share</title><style>body{font-family:Arial;max-width:650px;margin:auto;padding:24px;line-height:1.5}button{padding:12px 18px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-size:16px}.box{padding:18px;border:1px solid #ddd;border-radius:12px;margin-top:18px}.link{word-break:break-all;background:#f5f5f5;padding:10px;border-radius:8px}</style></head><body><h2>Simple File Share</h2><div id="app"></div><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script>
const app=document.getElementById("app"),p=new URLSearchParams(location.search),remote=p.get("peer"),token=p.get("token");
const ice=[{urls:"stun:stun.l.google.com:19302"},{urls:"turn:openrelay.metered.ca:80",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443",username:"openrelayproject",credential:"openrelayproject"},{urls:"turn:openrelay.metered.ca:443?transport=tcp",username:"openrelayproject",credential:"openrelayproject"}];
if(!remote){app.innerHTML='<div class="box"><b>Android B</b><p><button id="create">Create access request</button></p><p id="s"></p><div id="r"></div></div><div class="box"><b>Received files</b><div id="files"></div></div>';document.getElementById("create").onclick=()=>{let s=document.getElementById("s"),r=document.getElementById("r"),t=crypto.randomUUID(),peer=new Peer(undefined,{config:{iceServers:ice}});s.textContent="Creating request…";peer.on("open",id=>{r.innerHTML="<p>Send this link to Android A:</p><div class=link>"+location.origin+location.pathname+"?peer="+encodeURIComponent(id)+"&token="+encodeURIComponent(t)+"</div>";s.textContent="Waiting for Android A…"});peer.on("connection",c=>{let ok=false;c.on("open",()=>c.send({type:"hello",token:t}));c.on("data",d=>{if(!ok){if(d&&d.type==="auth"&&d.token===t){ok=true;s.textContent="Android A connected. Waiting for approved files…"}return}if(d&&d.type==="file-start"){window.f={name:d.name,type:d.mime||"application/octet-stream",size:d.size,ch:[]}}else if(d&&d.type==="file-end"&&window.f){let f=window.f,a=document.createElement("a"),u=URL.createObjectURL(new Blob(f.ch,{type:f.type}));a.href=u;a.download=f.name;a.textContent="Download "+f.name;document.getElementById("files").appendChild(a);window.f=null;s.textContent="File received."}else if(d instanceof ArrayBuffer&&window.f)window.f.ch.push(d)});c.on("error",e=>s.textContent="Connection error: "+e.message)});peer.on("error",e=>s.textContent="Peer error: "+e.type)}}
else{app.innerHTML='<div class="box"><b>Android A — Approve files</b><p>Select only the files you want to share.</p><input id="pick" type="file" multiple><p><button id="send" disabled>Allow selected files</button></p><p id="s">Connecting…</p></div>';let s=document.getElementById("s"),pick=document.getElementById("pick"),send=document.getElementById("send"),peer=new Peer(undefined,{config:{iceServers:ice}}),c,ready=false;peer.on("open",()=>{c=peer.connect(remote,{reliable:true});c.on("open",()=>c.send({type:"auth",token}));c.on("data",d=>{if(d&&d.type==="hello"&&d.token===token){ready=true;send.disabled=!pick.files.length;s.textContent="Connected. Select files and tap Allow selected files."}});c.on("error",e=>s.textContent="Connection error: "+e.message)});peer.on("error",e=>s.textContent="Could not connect to peer. "+e.type);pick.onchange=()=>send.disabled=!(ready&&pick.files.length);send.onclick=async()=>{send.disabled=true;for(const f of pick.files){c.send({type:"file-start",name:f.name,size:f.size,mime:f.type});for(let i=0;i<f.size;i+=65536)c.send(await f.slice(i,i+65536).arrayBuffer());c.send({type:"file-end"})}s.textContent="Selected files sent."}}
</script></body></html>
