<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Share</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
    }
    .box {
      width: min(92%, 420px);
      text-align: center;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px 18px;
      margin: 6px 0;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }
    #fileBtn {
      background: #1677ff;
      color: white;
    }
    #submitBtn {
      background: #111827;
      color: white;
    }
    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 14px;
      color: #4b5563;
      min-height: 20px;
    }
    input { display: none; }
  </style>
</head>
<body>
  <div class="box">
    <button id="fileBtn">File</button>
    <button id="submitBtn" disabled>Submit</button>
    <div id="status"></div>
  </div>

  <script>
    const WORKER_URL = "https://file-share-upload.janikhan550.workers.dev";

    const fileBtn = document.getElementById("fileBtn");
    const submitBtn = document.getElementById("submitBtn");
    const status = document.getElementById("status");

    let selectedFiles = [];
    let selectedFolderName = "folder";

    fileBtn.addEventListener("click", async () => {
      if (!window.showDirectoryPicker) {
        status.textContent = "Folder selection is not supported in this browser.";
        return;
      }

      try {
        const directory = await window.showDirectoryPicker({ mode: "read" });
        selectedFolderName = directory.name || "folder";
        selectedFiles = [];

        await collectFiles(directory, "");

        submitBtn.disabled = selectedFiles.length === 0;
        status.textContent = selectedFiles.length
          ? `${selectedFiles.length} file(s) selected`
          : "No files found";
      } catch (error) {
        if (error && error.name !== "AbortError") {
          status.textContent = "Could not select the folder.";
        }
      }
    });

    async function collectFiles(directoryHandle, currentPath) {
      for await (const entry of directoryHandle.values()) {
        if (entry.kind === "file") {
          const file = await entry.getFile();
          selectedFiles.push({
            file,
            path: currentPath ? `${currentPath}/${file.name}` : file.name
          });
        } else if (entry.kind === "directory") {
          const nextPath = currentPath
            ? `${currentPath}/${entry.name}`
            : entry.name;
          await collectFiles(entry, nextPath);
        }
      }
    }

    function encodePath(path) {
      return path.split("/").map(encodeURIComponent).join("/");
    }

    function makeUploadId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
    }

    submitBtn.addEventListener("click", async () => {
      if (!selectedFiles.length) return;

      fileBtn.disabled = true;
      submitBtn.disabled = true;

      const uploadId = makeUploadId();
      let uploaded = 0;

      try {
        for (const item of selectedFiles) {
          const objectPath = `uploads/${uploadId}/${selectedFolderName}/${item.path}`;
          const url = `${WORKER_URL}/${encodePath(objectPath)}`;

          status.textContent = `Uploading ${uploaded + 1} of ${selectedFiles.length}`;

          const response = await fetch(url, {
            method: "PUT",
            headers: {
              "Content-Type": item.file.type || "application/octet-stream"
            },
            body: item.file
          });

          if (!response.ok) {
            let message = `Upload failed (${response.status})`;
            try {
              const data = await response.json();
              if (data && data.error) message = data.error;
            } catch (_) {}
            throw new Error(message);
          }

          uploaded++;
        }

        status.textContent = `Uploaded ${uploaded} file(s) successfully`;
        selectedFiles = [];
      } catch (error) {
        status.textContent = `Upload stopped: ${error.message || "Unknown error"}`;
        submitBtn.disabled = false;
      } finally {
        fileBtn.disabled = false;
        if (selectedFiles.length) submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
