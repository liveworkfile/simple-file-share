<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>File Upload</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:20px;line-height:1.5;background:#fafafa}.box{padding:20px;border:1px solid #ddd;border-radius:14px;margin-top:18px;background:#fff}button{padding:13px 18px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-size:16px;width:100%;margin-top:8px}button:disabled{opacity:.5}.small{font-size:13px;color:#666}.bar{height:10px;background:#eee;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#1769e0}.item{padding:10px 0;border-bottom:1px solid #ddd;word-break:break-word}a{word-break:break-all}</style></head><body><h2>File Upload</h2><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://ouddechuphjxzyaueeld.supabase.co';const SUPABASE_KEY='sb_publishable_mQcukaJ6dnVD0Pvvb3xOLw_JbRQvSXA';const BUCKET='voice-notes';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const app=document.getElementById('app');const p=new URLSearchParams(location.search);const token=p.get('upload');const admin=p.get('admin')==='1';
const idb=(()=>{let req=indexedDB.open('file-share-bg',1);req.onupgradeneeded=()=>{const d=req.result;if(!d.objectStoreNames.contains('jobs'))d.createObjectStore('jobs',{keyPath:'id'});if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'});};return {open:()=>new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)}),put:(store,v)=>openTx(store,'readwrite',s=>s.put(v)),getAll:(store)=>openTx(store,'readonly',s=>s.getAll()),del:(store,k)=>openTx(store,'readwrite',s=>s.delete(k))};function openTx(store,mode,fn){return new Promise(async(res,rej)=>{try{const d=await idb.open();const tx=d.transaction(store,mode);const r=fn(tx.objectStore(store));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})}})();
function safe(s){return(s||'file').replace(/[^a-zA-Z0-9._()\- /]/g,'_').replace(/^\/+|\/+$/g,'')}function rid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
async function bgRegister(){if('serviceWorker' in navigator){await navigator.serviceWorker.register('./sw.js');if('SyncManager' in window){try{const reg=await navigator.serviceWorker.ready;await reg.sync.register('file-upload');}catch(e){}}}}
if(admin){app.innerHTML='<div class="box"><b>Uploaded files</b><p class="small">Stored in the private voice-notes bucket.</p><button id="refresh">Refresh</button><div id="list">Loading…</div></div>';const list=document.getElementById('list');async function walk(path='',out=[]){const{data,error}=await db.storage.from(BUCKET).list(path,{limit:1000,offset:0,sortBy:{column:'name',order:'asc'}});if(error)throw error;for(const x of data||[]){if(x.name==='.')continue;const child=path?path+'/'+x.name:x.name;if(x.id===null)await walk(child,out);else out.push(child)}return out}async function refresh(){try{const paths=await walk();if(!paths.length){list.textContent='No uploads yet.';return}list.innerHTML='';for(const path of paths){const r=document.createElement('div');r.className='item';r.textContent=path+' — ';const{data,error}=await db.storage.from(BUCKET).createSignedUrl(path,3600);if(error)r.textContent+=error.message;else{const a=document.createElement('a');a.href=data.signedUrl;a.target='_blank';a.textContent='Download';r.appendChild(a)}list.appendChild(r)}}catch(e){list.textContent='Error: '+e.message}}document.getElementById('refresh').onclick=refresh;refresh()}else if(!token){app.innerHTML='<div class="box"><b>Create upload link</b><p class="small">Send the link to the other Android phone.</p><button id="create">Create upload link</button><div id="result"></div></div><div class="box"><b>My uploaded files</b><button id="admin">Open upload list</button></div>';document.getElementById('create').onclick=()=>{const t=rid();const link=location.origin+location.pathname+'?upload='+encodeURIComponent(t);document.getElementById('result').innerHTML='<p><b>Upload link:</b></p><div style="word-break:break-all;background:#f5f5f5;padding:10px">'+link+'</div><button id="copy">Copy link</button>';document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(link);document.getElementById('copy').textContent='Copied'}catch(e){}}};document.getElementById('admin').onclick=()=>location.href=location.pathname+'?admin=1'}else{app.innerHTML='<div class="box"><b>Select folder</b><p class="small">After you tap Upload, the files are queued locally. The browser will attempt to continue the upload in the background if Chrome supports Background Sync.</p><button id="choose">Choose folder</button><p id="chosen" class="small">No folder selected.</p><button id="send" disabled>Start upload</button><p id="status" class="small"></p><div class="bar"><i id="bar"></i></div><p id="progress" class="small"></p></div>';const choose=document.getElementById('choose'),send=document.getElementById('send'),chosen=document.getElementById('chosen'),status=document.getElementById('status'),progress=document.getElementById('progress'),bar=document.getElementById('bar');let files=[],folder='';async function readDir(dir){const out=[];async function walk(h,path=''){for await(const e of h.values()){const rel=path+e.name;if(e.kind==='file')out.push({file:await e.getFile(),name:rel});else await walk(e,rel+'/')}}await walk(dir);return out}choose.onclick=async()=>{try{const d=await window.showDirectoryPicker({mode:'read'});folder=d.name;files=await readDir(d);chosen.textContent=folder+' — '+files.length+' file(s)';send.disabled=!files.length}catch(e){if(e.name!=='AbortError')status.textContent=e.message}};send.onclick=async()=>{send.disabled=true;choose.disabled=true;status.textContent='Preparing files for background upload…';const session=rid();let n=0;try{for(const item of files){const id=session+'-'+n++;await idb.put('files',{id,session,path:session+'__'+safe(folder)+'/'+safe(item.name),name:item.name,blob:item.file,type:item.file.type||'application/octet-stream'});await idb.put('jobs',{id,session,status:'queued'});progress.textContent='Queued '+n+' of '+files.length}}catch(e){status.textContent='Could not queue files: '+e.message;choose.disabled=false;send.disabled=false;return}await bgRegister();status.textContent='Upload queued. You can leave the page; Chrome will attempt to continue in the background.';bar.style.width='100%';try{const reg=await navigator.serviceWorker.ready;reg.active?.postMessage({type:'UPLOAD_NOW'})}catch(e){}}}
</script></body></html>
