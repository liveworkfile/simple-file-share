<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1769e0"><title>File</title><style>body{font-family:Arial,sans-serif;max-width:720px;margin:auto;padding:20px;background:#fafafa}.box{padding:20px;border:1px solid #ddd;border-radius:14px;background:#fff}button{padding:14px 18px;border:0;border-radius:9px;background:#1769e0;color:#fff;font-size:17px;width:100%;margin-top:10px}button:disabled{opacity:.5}.small{font-size:13px;color:#666}.bar{height:10px;background:#eee;border-radius:8px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:0;background:#1769e0}</style></head><body><div id="app"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://ouddechuphjxzyaueeld.supabase.co',KEY='sb_publishable_mQcukaJ6dnVD0Pvvb3xOLw_JbRQvSXA',BUCKET='voice-notes';const db=supabase.createClient(URL,KEY);const p=new URLSearchParams(location.search),token=p.get('upload'),admin=p.get('admin')==='1';
function id(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}function safe(s){return(s||'file').replace(/[^a-zA-Z0-9._()\- /]/g,'_').replace(/^\/+|\/+$/g,'')}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('file-share-v10',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('files'))d.createObjectStore('files',{keyPath:'id'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(v){return openDB().then(d=>new Promise((res,rej)=>{const t=d.transaction('files','readwrite');t.objectStore('files').put(v);t.oncomplete=res;t.onerror=()=>rej(t.error)}))}function all(){return openDB().then(d=>new Promise((res,rej)=>{const r=d.transaction('files').objectStore('files').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function registerBG(){if(!('serviceWorker'in navigator))return false;await navigator.serviceWorker.register('./sw.js');try{const r=await navigator.serviceWorker.ready;if('sync'in r)await r.sync.register('file-upload');return true}catch(e){return false}}
if(!token&&!admin){app.innerHTML='<div class="box"><button id="create">Create upload link</button><div id="out"></div><button id="admin">Open uploads</button></div>';create.onclick=()=>{const t=id(),link=location.origin+location.pathname+'?upload='+encodeURIComponent(t);out.innerHTML='<p style="word-break:break-all">'+link+'</p><button id="copy">Copy link</button>';copy.onclick=async()=>{try{await navigator.clipboard.writeText(link);copy.textContent='Copied'}catch(e){}}};admin.onclick=()=>location.href=location.pathname+'?admin=1'}
else if(admin){app.innerHTML='<div class="box"><button id="refresh">Refresh</button><div id="list">Loading…</div></div>';async function walk(path='',out=[]){const{data,error}=await db.storage.from(BUCKET).list(path,{limit:1000});if(error)throw error;for(const x of data||[]){if(x.name==='.')continue;const q=path?path+'/'+x.name:x.name;if(x.id===null)await walk(q,out);else out.push(q)}return out}async function refresh(){try{const a=await walk();list.innerHTML=a.length?'':'No files yet.';for(const q of a){const d=document.createElement('div');d.className='small';d.textContent=q+' — ';const r=await db.storage.from(BUCKET).createSignedUrl(q,3600);if(!r.error){const x=document.createElement('a');x.href=r.data.signedUrl;x.target='_blank';x.textContent='Download';d.appendChild(x)}list.appendChild(d)}}catch(e){list.textContent=e.message}}refresh.onclick=refresh;refresh()}
else{app.innerHTML='<div class="box"><button id="fileBtn">File</button><input id="picker" type="file" webkitdirectory directory multiple hidden><button id="submit" disabled>Submit</button><p id="status" class="small"></p><div class="bar"><i id="bar"></i></div><p id="progress" class="small"></p></div>';const fileBtn=document.getElementById('fileBtn'),picker=document.getElementById('picker'),submit=document.getElementById('submit'),status=document.getElementById('status'),bar=document.getElementById('bar'),progress=document.getElementById('progress');let files=[];fileBtn.onclick=()=>picker.click();picker.onchange=()=>{files=[...picker.files];submit.disabled=!files.length;status.textContent=files.length?files.length+' file(s) selected.':'No files selected.'};submit.onclick=async()=>{submit.disabled=true;fileBtn.disabled=true;status.textContent='Preparing upload…';const session=id();try{let i=0;for(const f of files){await put({id:session+'-'+i,session,path:session+'__'+safe(f.webkitRelativePath||f.name),blob:f,type:f.type||'application/octet-stream',status:'queued'});i++;progress.textContent='Queued '+i+' of '+files.length}const ok=await registerBG();status.textContent=ok?'Upload started. You can close Chrome; Android/Chrome will attempt to continue it in the background.':'Upload queued, but this Chrome version does not expose Background Sync.';try{const r=await navigator.serviceWorker.ready;r.active&&r.active.postMessage({type:'UPLOAD_NOW'})}catch(e){}bar.style.width='100%'}catch(e){status.textContent='Could not start upload: '+e.message;submit.disabled=false;fileBtn.disabled=false}}}
</script></body></html>
